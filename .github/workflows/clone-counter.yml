name: GitHub Traffic to Badge

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight
  workflow_dispatch: # Allows manual testing

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Traffic to Badge
        uses: sstutz/github-traffic-to-badge-action@v1
        with:
          TARGET_REPOS: "AkhirahStrong/AkhirahStrong"
          REPOSITORY_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
